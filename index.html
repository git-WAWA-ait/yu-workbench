<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>语寓 · 语寓于文，教思于行</title>
<meta name="theme-color" content="#6ea8dc" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="img/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="bgLayer"></div>
<div class="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">语</div>
      <div class="brand-text">
        <div class="brand-name">语寓</div>
        <div class="brand-sub">语寓于文，教思于行</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item active" data-view="dashboard"><span class="ico">▦</span>工作台</a>
      <a class="nav-item" data-view="lesson"><span class="ico">✎</span>备课中心</a>
      <a class="nav-item" data-view="homework"><span class="ico">✓</span>作业批改</a>
      <a class="nav-item" data-view="resource"><span class="ico">❖</span>素材资源库</a>
      <a class="nav-item" data-view="homeroom"><span class="ico">⌂</span>班主任工作</a>
      <a class="nav-item" data-view="analytics"><span class="ico">◔</span>班级学情</a>
      <a class="nav-item" data-view="honor"><span class="ico">🏅</span>荣誉登记册</a>
      <a class="nav-item" data-view="settings"><span class="ico">⚙</span>个人与设置</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user-mini">
        <div class="avatar" id="sideAvatar" title="点击修改头像">思</div>
        <div>
          <div class="uname" id="sideName">思思老师</div>
          <div class="urole">初三语文 · 班主任</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="viewTitle">工作台</div>
      <div class="topbar-search">
        <input type="text" id="globalSearch" placeholder="搜索待办 / 教案 / 素材 / 学生…" autocomplete="off" />
        <div class="search-drop" id="searchDrop" style="display:none"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn-ghost" id="backupBtn" title="数据备份（JSON 导入 / 导出）">💾 备份</button>
        <button class="btn-ghost" id="todoBtn">🔔 待办 <span class="badge" style="display:none">0</span></button>
        <button class="remind-icon" id="classRemindIcon" title="上课提醒">
          <span class="ri-emoji">⏰</span>
          <span class="remind-badge" id="remindBadge" style="display:none"></span>
        </button>
      </div>
    </header>
    <section class="content" id="content"><!-- 动态渲染 --></section>
  </main>
</div>
<button id="agentLauncher" class="agent-launcher" title="挖挖 · 智能体助手"><img src="img/wawa.png" alt="挖挖" /></button>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
